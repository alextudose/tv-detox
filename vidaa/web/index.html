<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acasă</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --lichen: #eef2ea;            /* text */
    --fog: rgba(238, 242, 234, .72); /* secondary text */
    --birch: #f6f3e8;             /* focus ring */
    --moss: 6, 10, 8;             /* scrim, as rgb triplet */
  }
  html { font-size: calc(100vw / 80); background: #000; }   /* 16px at 1280 wide, 24px at 1920 */
  body {
    margin: 0; height: 100vh; overflow: hidden; color: var(--lichen);
    font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
  }
  .photo {
    position: fixed; inset: 0; background: center / cover no-repeat;
    opacity: 0; transition: opacity 1.2s ease; will-change: opacity;
  }
  .photo.is-shown { opacity: 1; }
  .scrim {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(to top, rgba(var(--moss), .84) 0%, rgba(var(--moss), .45) 26%, rgba(var(--moss), 0) 52%),
      radial-gradient(ellipse 46rem 22rem at 100% 0%, rgba(var(--moss), .55), rgba(var(--moss), 0) 70%);
  }

  /* The plate: clock, date and where the photo was taken, like a field-guide caption */
  .plate { position: fixed; top: 2.4rem; right: 4rem; text-align: right; text-shadow: 0 .06rem 1.4rem rgba(0, 0, 0, .5), 0 0 .3rem rgba(0, 0, 0, .25); }
  .plate time {
    display: block; font-family: 'Fraunces', serif; font-weight: 300;
    font-variation-settings: 'opsz' 144; font-size: 6.75rem; line-height: .86; letter-spacing: -.03em;
    font-feature-settings: 'lnum', 'tnum';
  }
  .plate .date { margin-top: .7rem; font-size: 1.3rem; color: var(--fog); }
  .plate .place {
    margin-top: 1.5rem; font-family: 'Fraunces', serif; font-weight: 400;
    font-variation-settings: 'opsz' 36; font-size: 1.55rem; max-width: 26rem; margin-left: auto;
    transition: opacity .6s ease;
  }

  .dock { position: fixed; left: 4rem; right: 4rem; bottom: 3.6rem; display: flex; gap: 1.2rem; margin: 0; padding: 0; list-style: none; }
  .slot { flex: 0 1 9.2rem; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .tile {
    width: 100%; height: 5.75rem; border-radius: .85rem; overflow: hidden;
    display: grid; place-items: center; background: var(--bg, rgba(var(--moss), .55));
    opacity: .9; transform: translateZ(0);
    transition: transform .16s ease-out, opacity .16s ease-out, box-shadow .16s ease-out;
  }
  .tile img { display: block; height: 5.75rem; width: auto; }
  .tile.cover img { width: 100%; height: 5.75rem; object-fit: cover; }
  .tile.source { box-shadow: inset 0 0 0 .08rem rgba(238, 242, 234, .28); gap: .35rem; align-content: center; }
  .tile.source svg { width: 2.2rem; height: 2.2rem; stroke: var(--lichen); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tile.source span { font-size: .95rem; }
  .slot.is-focused .tile {
    opacity: 1; transform: translateY(-.45rem) scale(1.12);
    box-shadow: 0 0 0 .2rem var(--birch), 0 0 0 .32rem rgba(var(--moss), .55), 0 1.4rem 2.6rem rgba(0, 0, 0, .55);
  }
  .name { margin-top: 1.05rem; font-size: 1.25rem; font-weight: 700; opacity: 0; transition: opacity .16s; white-space: nowrap; }
  .slot.is-focused .name { opacity: 1; }
  .slot.has-text .name { visibility: hidden; }

  .credit { position: fixed; right: 4rem; bottom: 1.5rem; font-size: .8rem; color: var(--fog); text-shadow: 0 0 .6rem rgba(0, 0, 0, .6); }
  .hint {
    position: fixed; left: 4rem; bottom: 12.5rem; max-width: 34rem; padding: .9rem 1.2rem;
    border-radius: .7rem; background: rgba(var(--moss), .9); font-size: 1.15rem; line-height: 1.4;
    opacity: 0; transition: opacity .2s;
  }
  .hint.is-shown { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .photo, .tile, .name, .hint, .plate .place { transition: none; }
  }
</style>
</head>
<body>
  <div class="photo" id="photo-a"></div>
  <div class="photo" id="photo-b"></div>
  <div class="scrim"></div>
  <header class="plate">
    <time id="time"></time>
    <div class="date" id="date"></div>
    <div class="place" id="place"></div>
  </header>
  <div class="hint" id="hint" role="status"></div>
  <ul class="dock" id="dock"></ul>
  <footer class="credit" id="credit"></footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
