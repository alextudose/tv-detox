[project]
name = "vidaa-detox"
version = "0.1.2"
description = "Reversible debloat, backup/restore and a calm home screen for Hisense VIDAA TVs"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=1.6,<3"]

[dependency-groups]
dev = ["coverage>=7.6"]

[tool.uv]
package = false

[tool.coverage.run]
source = ["detox"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
